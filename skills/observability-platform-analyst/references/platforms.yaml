# LLM observability platforms: facts, scores and sources.
#
# facts    : what the sources say. "Not confirmed" means the sources reviewed
#            did not confirm the feature; it may still exist.
# scores   : 0-3 per criterion (see criteria.yaml). Editorial assessment, not benchmarks.
# must     : true / false / null (null = not confirmed)
# as_of    : when pricing and features were last checked. Re-verify before buying.

as_of: 2026-10
sources:
  - id: marktechpost
    title: "MarkTechPost: Top LLM observability and evaluation platforms in 2026"
    url: https://www.marktechpost.com/2026/08/09/top-llm-observability-and-evaluation-platforms-in-2026-langfuse-langsmith-braintrust-arize-and-more-compared/
  - id: morph
    title: "Morph: LLM observability tools (2026), every free tier limit listed"
    url: https://www.morphllm.com/llm-observability-tools
  - id: langfuse-clickhouse
    title: "Langfuse: Joining ClickHouse"
    url: https://langfuse.com/blog/joining-clickhouse
  - id: orrick
    title: "Orrick: Langfuse acquired by ClickHouse (January 2026)"
    url: https://www.orrick.com/en/news/2026/01/open-source-llm-observability-langfuse-acquired-by-clickhouse-inc
  - id: opik-pypi
    title: "Opik on PyPI"
    url: https://pypi.org/project/opik/2.2.44/
  - id: arize-faq
    title: "Arize: difference between Phoenix and Arize"
    url: https://www.arize.com/docs/phoenix/resources/frequently-asked-questions/what-is-the-difference-between-phoenix-and-arize.md
  - id: mlflow
    title: "MLflow: Top LLM observability tools in 2026"
    url: https://mlflow.org/articles/top-llm-observability-tools-in-2026-a-pro-guide/

platforms:
  - id: langsmith
    name: LangSmith
    owner: LangChain
    summary: Default backend for LangChain and LangGraph; what the LexAgent notebook uses.
    category: buy-eval-first
    scores: {data: 1, instr: 3, agent: 3, eval: 3, cost: 1, ops: 3, ease: 3}
    must: {selfhost: false, osi: false, otel: true, ci: true}
    facts:
      license: Closed source
      selfhost: Enterprise plan only (your VPC)
      free_tier: 5k traces/mo, 1 seat
      paid_from: $39/seat/mo
      otel: "Yes"
      agent_depth: "Strong: trace clustering, failure grouping"
      frameworks: Best for LangChain/LangGraph; Python, TS, Go, Java SDKs
      datasets: Strong
      llm_judge: Yes, calibrated to human preference
      online_evals: "Yes"
      human_annotation: Annotation queues
      ci_gating: Side-by-side comparisons gate regressions
      cost_tracking: Unified view across LLM, tools, retrieval, APIs
      prompt_mgmt: Prompt Hub
      extras: Agent deployment runtime
      best_for: Teams already on LangChain/LangGraph who want zero setup
    strengths: [Deepest LangChain/LangGraph integration, Online evals and annotation queues]
    watch_out: [Closed source, Self-hosting needs an Enterprise license]
    sources: [marktechpost, morph]

  - id: langfuse
    name: Langfuse
    owner: ClickHouse (acquired Jan 2026)
    summary: The most widely self-hosted open-source option.
    category: self-host
    scores: {data: 3, instr: 3, agent: 3, eval: 3, cost: 3, ops: 2, ease: 2}
    must: {selfhost: true, osi: true, otel: true, ci: true}
    facts:
      license: MIT core; enterprise folders separate
      selfhost: "Free: Docker Compose, Helm, Terraform"
      free_tier: 50k units/mo, 2 users, 30-day access
      paid_from: $29/mo
      otel: "Yes"
      agent_depth: "Strong: nested traces, session replay"
      frameworks: "Framework-agnostic: OTel, LangChain, OpenAI SDK, LiteLLM"
      datasets: "Strong: versioned datasets"
      llm_judge: Yes, with templates
      online_evals: Production monitoring
      human_annotation: Annotation queues
      ci_gating: GitHub Actions regression tests
      cost_tracking: By model, user, session
      prompt_mgmt: Yes, with playground
      extras: Strong data-residency control
      best_for: Open source, self-hosting, data residency
    strengths: [Free self-hosting with an MIT core, Prompt management and evals included]
    watch_out: [You run the infrastructure when self-hosting, "Ownership changed in 2026; licensing said to be unchanged"]
    sources: [marktechpost, morph, langfuse-clickhouse, orrick]

  - id: phoenix
    name: Arize Phoenix
    owner: Arize (AX is commercial)
    summary: Free, OpenTelemetry-native tracing that runs on your laptop.
    category: self-host
    scores: {data: 2, instr: 3, agent: 2, eval: 3, cost: 3, ops: 2, ease: 2}
    must: {selfhost: true, osi: false, otel: true, ci: null}
    facts:
      license: Elastic License 2.0 (source-available, not OSI)
      selfhost: "Free: pip, Docker, Helm"
      free_tier: No caps when self-hosted
      paid_from: Arize AX is commercial
      otel: Native (OpenInference conventions)
      agent_depth: Good
      frameworks: 40+ integrations; strong LlamaIndex, OpenAI Agents SDK
      datasets: "Strong: datasets and experiments"
      llm_judge: Yes, many templates
      online_evals: Drift detection (AX)
      human_annotation: Not confirmed
      ci_gating: Not confirmed
      cost_tracking: "Yes"
      prompt_mgmt: Prompt playground
      extras: Embedding clustering; classic ML too
      best_for: Free local tracing
    strengths: [Runs locally for free, "OpenTelemetry-native, so instrumentation is portable"]
    watch_out: [Elastic License is not OSI open source, Online monitoring lives in paid AX]
    sources: [marktechpost, morph, arize-faq]

