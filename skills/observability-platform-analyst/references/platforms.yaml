    owner: Braintrust
    summary: Evaluation-first platform with CI quality gates.
    category: buy-eval-first
    scores: {data: 1, instr: 2, agent: 3, eval: 3, cost: 1, ops: 2, ease: 2}
    must: {selfhost: false, osi: false, otel: null, ci: true}
    facts:
      license: Closed source
      selfhost: Enterprise only (on-prem or hybrid)
      free_tier: $10 credits, 1 GB, 14-day retention
      paid_from: $249/mo
      otel: Not confirmed
      agent_depth: "Strong: custom trace database"
      frameworks: Framework-agnostic SDKs
      datasets: "Strongest: versioned datasets, experiments"
      llm_judge: Yes, plus an AI scorer generator
      online_evals: "Yes"
      human_annotation: Human scoring
      ci_gating: Blocks regressions before deploy
      cost_tracking: "Yes"
      prompt_mgmt: Playground tested on production data
      extras: Agent that drafts prompts and scorers
      best_for: Teams that want evals to block bad releases
    strengths: [Strongest experiment and CI gating workflow, Unlimited users on free tier]
    watch_out: [Highest paid entry price, Closed source]
    sources: [marktechpost, morph]

